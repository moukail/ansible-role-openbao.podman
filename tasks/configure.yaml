---
- name: Open OpenBao port in firewall
  become: true
  ansible.posix.firewalld:
    port: "{{ openbao_port }}/tcp"
    permanent: true
    state: enabled
    immediate: true

- name: Configure Shamir seal
  ansible.builtin.set_fact:
    openbao_seal_template: ""
  when: openbao_seal_type == 'shamir'

- name: Configure PKCS#11 seal
  ansible.builtin.set_fact:
    openbao_seal_template: seal-pkcs11.hcl.j2
  when: openbao_seal_type == 'pkcs11'

- name: Configure Transit seal
  ansible.builtin.set_fact:
    openbao_seal_template: seal-transit.hcl.j2
  when: openbao_seal_type == 'transit'

- name: Create Openbao base directory
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    recurse: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0750"
  loop:
    - /opt/openbao
    - /opt/openbao/tls
    - "{{ softhsm_token_dir }}"

- name: Get Openbao container user information
  become: false
  ansible.builtin.command: podman run --rm --entrypoint id {{ openbao_image }}
  register: openbao_container_identity
  changed_when: false

- name: Set Openbao container UID and GID
  ansible.builtin.set_fact:
    openbao_container_uid: "{{ openbao_container_identity.stdout | regex_search('uid=([0-9]+)', '\\1') | first }}"
    openbao_container_gid: "{{ openbao_container_identity.stdout | regex_search('gid=([0-9]+)', '\\1') | first }}"

- name: Create Openbao container directories
  become: true
  become_method: containers.podman.podman_unshare
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    recurse: true
    owner: "{{ openbao_container_uid }}"
    group: "{{ openbao_container_gid }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: /opt/openbao/config, mode: "0750"}
    - {path: /opt/openbao/data, mode: "0700"}
    - {path: /opt/openbao/tls, mode: "0750"}
    - {path: /opt/openbao/logs, mode: "0750"}
    - {path: /opt/openbao/plugins, mode: "0750"}

- name: Ensure SoftHSM token directory
  become: true
  become_method: containers.podman.podman_unshare
  ansible.builtin.file:
    path: "{{ softhsm_token_dir }}"
    state: directory
    recurse: true
    owner: "{{ openbao_container_uid }}"
    group: "{{ openbao_container_gid }}"
    mode: "0700"
  when: openbao_seal_type == 'pkcs11'

- name: Secure Openbao TLS private key
  become: true
  become_method: containers.podman.podman_unshare
  ansible.builtin.file:
    path: /opt/openbao/tls/server.key
    state: file
    owner: "{{ openbao_container_uid }}"
    group: "{{ openbao_container_gid }}"
    mode: "0600"

- name: Generate OpenBAO configuration file
  become: true
  become_method: containers.podman.podman_unshare
  ansible.builtin.template:
    src: config.hcl.j2
    dest: /opt/openbao/config/config.hcl
    owner: "{{ openbao_container_uid }}"
    group: "{{ openbao_container_gid }}"
    mode: "0640"
