---
- name: Wait for OpenBAO to be accessible
  ansible.builtin.uri:
    url: "https://{{ ansible_facts['default_ipv4']['address'] }}:{{ openbao_port }}/"
    method: GET
    status_code: 200
    validate_certs: false
  register: openbao_health
  retries: 5
  delay: 3
  until: openbao_health.status == 200

- name: Gather OpenBAO status information...
  ansible.builtin.uri:
    url: "https://{{ ansible_facts['default_ipv4']['address'] }}:{{ openbao_port }}/v1/sys/init"
    method: GET
    validate_certs: false
    return_content: true
  register: openbao_init_status
  ignore_errors: true

# ---------------------------------------------------------
# SHAMIR INITIALIZATION
# ---------------------------------------------------------

- name: Initialize OpenBao with Shamir
  ansible.builtin.uri:
    url: "https://{{ ansible_facts['default_ipv4']['address'] }}:{{ openbao_port }}/v1/sys/init"
    method: POST
    validate_certs: false
    body_format: json
    body:
      secret_shares: "{{ openbao_shares }}"
      secret_threshold: "{{ openbao_threshold }}"
    status_code: 200
  register: openbao_shamir_init_results
  when:
    - not (openbao_init_status.json.initialized | bool)
    - openbao_seal_type == 'shamir'

# ---------------------------------------------------------
# SAVE AUTO-UNSEAL INITIALIZATION MATERIAL
# ---------------------------------------------------------

- name: Initialize OpenBao with auto-unseal
  ansible.builtin.uri:
    url: "https://{{ ansible_facts['default_ipv4']['address'] }}:{{ openbao_port }}/v1/sys/init"
    method: POST
    validate_certs: false
    body_format: json
    body:
      recovery_shares: "{{ openbao_shares }}"
      recovery_threshold: "{{ openbao_threshold }}"
    status_code: 200
  register: openbao_auto_init_results
  when:
    - not (openbao_init_status.json.initialized | bool)
    - openbao_seal_type in ['pkcs11', 'transit']

# ---------------------------------------------------------
# SAVE SHAMIR INITIALIZATION MATERIAL
# ---------------------------------------------------------

- name: Save Shamir root token and unseal keys
  ansible.builtin.set_fact:
    openbao_token: "{{ openbao_shamir_init_results.json.root_token }}"
    openbao_keys: "{{ openbao_shamir_init_results.json.keys_base64 }}"
    cacheable: false
  when:
    - openbao_seal_type == 'shamir'
    - openbao_shamir_init_results is defined
    - not (openbao_shamir_init_results.skipped | default(false) | bool)
  #no_log: true

# ---------------------------------------------------------
# SAVE AUTO-UNSEAL INITIALIZATION MATERIAL
# ---------------------------------------------------------

- name: Save auto-unseal root token and recovery keys
  ansible.builtin.set_fact:
    openbao_token: "{{ openbao_auto_init_results.json.root_token }}"
    openbao_keys: "{{ openbao_auto_init_results.json.recovery_keys_base64 }}"
    cacheable: false
  when:
    - openbao_seal_type in ['pkcs11', 'transit']
    - openbao_auto_init_results is defined
    - not (openbao_auto_init_results.skipped | default(false) | bool)
  no_log: true

# ---------------------------------------------------------
# VERIFY SEAL STATUS
# ---------------------------------------------------------
- name: Check OpenBAO seal status
  ansible.builtin.uri:
    url: "https://{{ ansible_facts['default_ipv4']['address'] }}:{{ openbao_port }}/v1/sys/seal-status"
    method: GET
    validate_certs: false
    status_code: 200
  register: openbao_seal_status

# ---------------------------------------------------------
# SHAMIR UNSEAL ONLY
# ---------------------------------------------------------

- name: Unseal OpenBAO
  ansible.builtin.uri:
    url: "https://{{ ansible_facts['default_ipv4']['address'] }}:{{ openbao_port }}/v1/sys/unseal"
    method: PUT
    validate_certs: false
    body_format: json
    body:
      key: "{{ item }}"
  loop: "{{ openbao_keys[:(openbao_threshold | int)] }}"
  when:
    - openbao_seal_type == 'shamir'
    - openbao_keys is defined
    - openbao_seal_status.json.sealed | bool

- name: Show OpenBAO openbao_seal_status
  ansible.builtin.debug:
    var: openbao_seal_status.json