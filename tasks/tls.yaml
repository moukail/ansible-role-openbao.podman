---
- name: Create openbao-tls volume
  become: true
  become_user: "{{ ansible_user }}"
  containers.podman.podman_volume:
    state: present
    name: openbao-tls
  register: openbao_tls_volume

#- name: Create directory for OpenBAO TLS files
#  ansible.builtin.file:
#    path: /opt/openbao/tls
#    state: directory
#    mode: "0755"

- name: Check existing OpenBao TLS certificate
  ansible.builtin.stat:
    path: "{{ openbao_tls_volume.volume.Mountpoint }}/tls.crt"
  register: openbao_tls_cert

- name: Configure openssl.cnf
  ansible.builtin.template:
    src: openssl.cnf.j2
    dest: "{{ openbao_tls_volume.volume.Mountpoint }}/openssl.cnf"
    mode: "0644"
  register: openbao_tls_config

- name: Generate OpenSSL key and certificate
  ansible.builtin.command: >
    openssl req -x509 -nodes -days 3650
    -newkey rsa:4096
    -keyout {{ openbao_tls_volume.volume.Mountpoint }}/tls.key
    -out {{ openbao_tls_volume.volume.Mountpoint }}/tls.crt
    -config {{ openbao_tls_volume.volume.Mountpoint }}/openssl.cnf
  when: >
    openbao_tls_config.changed or
    not openbao_tls_cert.stat.exists

- name: chmod TLS key
  ansible.builtin.file:
    path: "{{ openbao_tls_volume.volume.Mountpoint }}/tls.crt"
    mode: "0644"

- name: chmod TLS key
  ansible.builtin.file:
    path: "{{ openbao_tls_volume.volume.Mountpoint }}/tls.key"
    mode: "0600"