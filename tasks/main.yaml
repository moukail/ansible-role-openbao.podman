---
- name: Configure selected seal
  ansible.builtin.include_tasks: configure.yaml

- name: Ensure Podman is installed
  become: true
  ansible.builtin.package:
    name: podman
    state: present

- name: Enable systemd lingering for the user
  become: true
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ ansible_user }}"
    creates: "/var/lib/systemd/linger/{{ ansible_user }}"

- name: Create Openbao base directory
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    recurse: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0750"
  loop:
    - /opt/openbao
    - /opt/openbao/tls

- name: Get Openbao container user information
  become: false
  ansible.builtin.command: podman run --rm --entrypoint id {{ openbao_image }}
  register: openbao_container_identity
  changed_when: false

- name: Set Openbao container UID and GID
  ansible.builtin.set_fact:
    openbao_container_uid: "{{ openbao_container_identity.stdout | regex_search('uid=([0-9]+)', '\\1') | first }}"
    openbao_container_gid: "{{ openbao_container_identity.stdout | regex_search('gid=([0-9]+)', '\\1') | first }}"

- name: Create Openbao container directories
  become: true
  become_method: containers.podman.podman_unshare
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    recurse: true
    owner: "{{ openbao_container_uid }}"
    group: "{{ openbao_container_gid }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: /opt/openbao/config, mode: "0750"}
    - {path: /opt/openbao/data, mode: "0700"}
    - {path: /opt/openbao/tls, mode: "0750"}
    - {path: /opt/openbao/logs, mode: "0750"}

- name: Secure Openbao TLS private key
  become: true
  become_method: containers.podman.podman_unshare
  ansible.builtin.file:
    path: /opt/openbao/tls/server.key
    state: file
    owner: "{{ openbao_container_uid }}"
    group: "{{ openbao_container_gid }}"
    mode: "0600"

- name: Generate OpenBAO configuration file
  become: true
  become_method: containers.podman.podman_unshare
  ansible.builtin.template:
    src: config.hcl.j2
    dest: /opt/openbao/config/config.hcl
    owner: "{{ openbao_container_uid }}"
    group: "{{ openbao_container_gid }}"
    mode: "0640"

- name: Generate OpenBAO env file
  become: true
  become_method: containers.podman.podman_unshare
  ansible.builtin.template:
    src: openbao.env.j2
    dest: /opt/openbao/config/openbao.env"
    owner: "{{ openbao_container_uid }}"
    group: "{{ openbao_container_gid }}"
  when: openbao_seal_type == 'pkcs11'

- name: Create Podman Quadlet directory
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.file:
    path: ~/.config/containers/systemd/
    state: directory
    mode: "0755"

# verify with /usr/lib/systemd/system-generators/podman-system-generator --user --dryrun
- name: Create Quadlet for OpenBAO container
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.template:
    src: openbao.container.j2
    dest: "~/.config/containers/systemd/{{ openbao_container_name }}.container"
    mode: '0644'

- name: Enable and start OpenBAO container via Quadlet
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.systemd:
    name: "{{ openbao_container_name }}.service"
    state: restarted
    daemon_reload: true
    scope: user

- name: Initialize OpenBao
  ansible.builtin.include_tasks: initialize.yaml
