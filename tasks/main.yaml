---
- name: Configure selected seal
  ansible.builtin.include_tasks: configure.yaml

- name: Ensure Podman is installed
  become: true
  ansible.builtin.package:
    name: podman
    state: present

- name: Enable systemd lingering for the user
  become: true
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ ansible_user }}"
    creates: "/var/lib/systemd/linger/{{ ansible_user }}"

#- name: Configure TLS
#  ansible.builtin.include_tasks: tls.yaml

- name: Create OpenBao configuration directory
  become: true
  ansible.builtin.file:
    path: /opt/openbao/config
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0750"

- name: Generate OpenBAO configuration file
  become: true
  ansible.builtin.template:
    src: openbao.hcl.j2
    dest: /opt/openbao/config/openbao.hcl
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0640"

- name: Generate OpenBAO env file
  ansible.builtin.template:
    src: openbao.env.j2
    dest: "{{ openbao_config_volume.volume.Mountpoint }}/openbao.env"
  when: openbao_seal_type == 'pkcs11'

- name: Create Podman Quadlet directory
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.file:
    path: ~/.config/containers/systemd/
    state: directory
    mode: "0755"

# verify with /usr/lib/systemd/system-generators/podman-system-generator --user --dryrun
- name: Create Quadlet for OpenBAO container
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.template:
    src: openbao.container.j2
    dest: "~/.config/containers/systemd/container-{{ openbao_container_name }}.container"
    mode: '0644'

- name: Enable and start OpenBAO container via Quadlet
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.systemd:
    name: "container-{{ openbao_container_name }}.service"
    state: restarted
    daemon_reload: true
    scope: user

- name: Initialize OpenBao
  ansible.builtin.include_tasks: initialize.yaml
