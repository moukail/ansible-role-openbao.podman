---
# Supported: shamir, pkcs11, kmip
openbao_seal_type: shamir

openbao_version: 2.7.2
openbao_image: quay.io/openbao/openbao-ubi:{{ openbao_version }}
openbao_container_name: openbao

openbao_port: 8200
openbao_shares: 5
openbao_threshold: 3

cert_dir: /opt/openbao/tls

softhsm_conf_path: /etc/softhsm2.conf

openbao_pkcs11:
  plugin_image: "ghcr.io/openbao/openbao-plugin-kms-pkcs11:v0.3.0"
  plugin_sha256: "babba58243c7db7ffb9b906e25f35643704e8814792f5b678b3c215acba284f5"
  library: "{{ softhsm_library | default('/lib/softhsm/libsofthsm2.so') }}"
  token_label: "{{ softhsm_token_label | default('OpenBao') }}"
  key_label: "{{ softhsm_key_label | default('bao-root-key-aes') }}"
  mechanism: AES_GCM
  pin: "{{ softhsm_user_pin | default('') }}"

kmip_endpoint: "host.containers.internal:5696"
kmip_key_id: "1"